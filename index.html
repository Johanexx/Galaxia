
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universo Infinito ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #02010a;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

canvas {
    display: block;
}

#interface {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
}

.header {
    position: absolute;
    top: 22px;
    width: 100%;
    text-align: center;
    text-shadow: 0 0 20px #bd55ff;
}

.header h1 {
    margin: 0;
    font-size: clamp(23px, 5vw, 38px);
    color: #f6d3ff;
    letter-spacing: 3px;
}

.header p {
    color: #c9b5e7;
    font-size: 12px;
    letter-spacing: 2px;
}

#help {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: #cbb8e6;
}

.controls {
    position: absolute;
    right: 18px;
    top: 18px;
    display: flex;
    gap: 9px;
    pointer-events: auto;
}

.ui-button {
    background: #170c2bc9;
    color: white;
    border: 1px solid #a45be5;
    border-radius: 25px;
    padding: 10px 15px;
    cursor: pointer;
    backdrop-filter: blur(10px);
}

.ui-button:hover {
    background: #7435a5;
}

#panel {
    position: fixed;
    z-index: 10;
    display: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(410px, 90vw);
    max-height: 85vh;
    overflow-y: auto;
    padding: 22px;
    border-radius: 22px;
    border: 1px solid #d58bff88;
    background: linear-gradient(145deg, #1b1030f5, #090615f5);
    box-shadow: 0 0 70px #a32aff55;
    text-align: center;
    animation: appear .6s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translate(-50%, -45%) scale(.9);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

#panel img {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    border-radius: 15px;
    margin: 10px 0;
    box-shadow: 0 0 25px #b743ff55;
}

#panel h2 {
    color: #ffc1f2;
    text-shadow: 0 0 15px #ec49ff;
}

#panel p {
    color: #e2d4f6;
    line-height: 1.8;
    font-size: 15px;
}

#subtitle {
    color: #c47bff;
    font-size: 11px;
    letter-spacing: 3px;
}

#close {
    position: absolute;
    right: 12px;
    top: 8px;
    background: transparent;
    color: white;
    border: none;
    font-size: 25px;
    cursor: pointer;
}

#travel {
    position: fixed;
    z-index: 4;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
    color: #f7c5ff;
    text-shadow: 0 0 25px #ff38d7;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s;
}

#musicStatus {
    font-size: 11px;
    color: #d8baff;
}

@media(max-width:600px) {
    .controls {
        top: auto;
        right: 10px;
        bottom: 65px;
    }
    .ui-button {
        padding: 9px 11px;
        font-size: 11px;
    }
}
</style>

<script type="importmap">
{
 "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
 }
}
</script>
</head>

<body>

<div id="interface">

    <div class="header">
        <h1>✦ NUESTRO UNIVERSO ✦</h1>
        <p>UN VIAJE A TRAVÉS DE LO QUE SIENTO POR TI</p>
    </div>

    <div class="controls">
        <button class="ui-button" id="musicButton">♫ Música</button>
        <button class="ui-button" id="homeButton">⌂ Inicio</button>
    </div>

    <div id="help">
        ARRASTRA PARA EXPLORAR · USA EL ZOOM · SELECCIONA UN PLANETA
    </div>
</div>

<div id="travel">Viajando entre estrellas ✨</div>

<div id="panel">
    <button id="close">×</button>
    <div id="subtitle">UN LUGAR ESPECIAL</div>
    <h2 id="planetTitle">Mi universo</h2>
    <img id="planetPhoto" src="fotos/foto1.jpg" alt="Nuestro recuerdo">
    <p id="planetMessage"></p>
    <button class="ui-button" id="returnButton">Volver al universo ❤️</button>
</div>

<audio id="music" src="audio/musica.mp3" loop preload="auto"></audio>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================
// 1. CONFIGURACIÓN DEL UNIVERSO
// =====================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02010b);
scene.fog = new THREE.FogExp2(0x05020e, 0.0015);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1500
);

camera.position.set(0, 17, 58);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;

document.body.appendChild(renderer.domElement);

// =====================================
// 2. CÁMARA Y MOVIMIENTO
// =====================================

const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.minDistance = 5;
controls.maxDistance = 120;
controls.enablePan = true;
controls.autoRotate = false;

// =====================================
// 3. ILUMINACIÓN
// =====================================

scene.add(new THREE.AmbientLight(0x9999cc, 1.5));

const centralLight = new THREE.PointLight(
    0xffa9ef,
    1800,
    200
);

centralLight.position.set(0, 10, 0);
scene.add(centralLight);

// =====================================
// 4. ESTRELLAS DEL UNIVERSO
// =====================================

const starsGeometry = new THREE.BufferGeometry();
const positions = [];
const colors = [];

for(let i = 0; i < 10000; i++) {

    positions.push(
        (Math.random() - .5) * 600,
        (Math.random() - .5) * 400,
        (Math.random() - .5) * 600
    );

    const color = new THREE.Color();

    color.setHSL(
        .65 + Math.random() * .25,
        .6,
        .7 + Math.random() * .3
    );

    colors.push(color.r, color.g, color.b);
}

starsGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
);

starsGeometry.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(colors, 3)
);

const starsMaterial = new THREE.PointsMaterial({
    size: .3,
    vertexColors: true,
    transparent: true,
    opacity: .9,
    sizeAttenuation: true
});

const stars = new THREE.Points(
    starsGeometry,
    starsMaterial
);

scene.add(stars);

// =====================================
// 5. NEBULOSA ESPACIAL
// =====================================

const nebulaGeometry = new THREE.BufferGeometry();

const nebulaPositions = [];
const nebulaColors = [];

const nebulaPalette = [
    0xff36bb,
    0x913aff,
    0x365bff,
    0xe2a0ff
];

for(let i = 0; i < 6000; i++) {

    const angle = Math.random() * Math.PI * 2;
    const radius = 8 + Math.random() * 34;

    const spread = (Math.random() - .5) * 12;

    nebulaPositions.push(
        Math.cos(angle) * radius,
        spread,
        Math.sin(angle) * radius
    );

    const color = new THREE.Color(
        nebulaPalette[
            Math.floor(Math.random() * nebulaPalette.length)
        ]
    );

    nebulaColors.push(color.r, color.g, color.b);
}

nebulaGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(nebulaPositions, 3)
);

nebulaGeometry.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(nebulaColors, 3)
);

const nebula = new THREE.Points(
    nebulaGeometry,
    new THREE.PointsMaterial({
        size: .65,
        vertexColors: true,
        transparent: true,
        opacity: .38,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    })
);

scene.add(nebula);

// =====================================
// 6. TEXTURAS PROCEDURALES
// =====================================

function createPlanetTexture(baseColor) {

    const canvas = document.createElement('canvas');

    canvas.width = 512;
    canvas.height = 256;

    const ctx = canvas.getContext('2d');

    const gradient = ctx.createLinearGradient(0, 0, 512, 256);

    gradient.addColorStop(0, baseColor);
    gradient.addColorStop(.5, '#21123c');
    gradient.addColorStop(1, baseColor);

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 512, 256);

    // Bandas y detalles de superficie
    for(let i = 0; i < 100; i++) {

        ctx.fillStyle = `rgba(255,255,255,${Math.random()*.09})`;

        ctx.beginPath();

        ctx.ellipse(
            Math.random() * 512,
            Math.random() * 256,
            20 + Math.random() * 90,
            2 + Math.random() * 12,
            Math.random() * .2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;

    return texture;
}

// =====================================
// 7. DATOS DE LOS PLANETAS
// =====================================

const worlds = [

    {
        name: 'El comienzo',
        subtitle: 'PLANETA DE LOS RECUERDOS',
        color: 0xe73fbd,
        base: '#a52c9b',
        size: 3,
        position: [-16, 3, -10],
        photo: 'fotos/foto1.jpg',
        message: 'Toda historia tiene un comienzo. Y si pudiera volver al primer día, volvería a elegir conocerte. ❤️',
        ring: true
    },

    {
        name: 'Mi persona favorita',
        subtitle: 'PLANETA DEL AMOR',
        color: 0x9b54ff,
        base: '#5630a5',
        size: 4,
        position: [15, -3, -12],
        photo: 'fotos/foto2.jpg',
        message: 'No necesito un universo perfecto. Me basta con compartir el mío contigo. Eres una de las cosas más bonitas de mi vida. 💗',
        ring: true
    },

    {
        name: 'Nuestros sueños',
        subtitle: 'PLANETA DEL FUTURO',
        color: 0x37bfff,
        base: '#176da5',
        size: 3.5,
        position: [-2, 8, 20],
        photo: 'fotos/foto3.jpg',
        message: 'Todavía quedan millones de lugares por conocer, aventuras por vivir y recuerdos por crear. Ojalá muchos sean contigo. ✨',
        ring: false
    },

    {
        name: 'Mi estrella',
        subtitle: 'ESTRELLA ESPECIAL',
        color: 0xffc76a,
        base: '#b97930',
        size: 2.5,
        position: [23, 9, 13],
        photo: 'fotos/foto4.jpg',
        message: 'Entre millones de estrellas, mis ojos siempre encontrarían la tuya. Nunca olvides lo especial que eres. 🌟',
        ring: false
    }
];

// =====================================
// 8. CREAR PLANETAS 3D
// =====================================

const planets = [];

function createWorld(info, index) {

    const group = new THREE.Group();

    group.position.set(...info.position);

    const texture = createPlanetTexture(info.base);

    const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: .85,
        metalness: .08,
        emissive: info.color,
        emissiveIntensity: .08
    });

    const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(info.size, 64, 64),
        material
    );

    group.add(sphere);

    // Atmósfera
    const atmosphere = new THREE.Mesh(
        new THREE.SphereGeometry(info.size * 1.12, 48, 48),
        new THREE.MeshBasicMaterial({
            color: info.color,
            transparent: true,
            opacity: .12,
            side: THREE.BackSide
        })
    );

    group.add(atmosphere);

    // Anillos
    if(info.ring) {

        const ring = new THREE.Mesh(
            new THREE.RingGeometry(
                info.size * 1.35,
                info.size * 2.1,
                100
            ),
            new THREE.MeshBasicMaterial({
                color: info.color,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: .65
            })
        );

        ring.rotation.x = Math.PI / 2.4;
        group.add(ring);
    }

    // Halo luminoso
    const light = new THREE.PointLight(
        info.color,
        65,
        30
    );

    group.add(light);

    sphere.userData.info = info;
    sphere.userData.group = group;

    scene.add(group);

    planets.push({
        mesh: sphere,
        group: group,
        info: info,
        original: new THREE.Vector3(...info.position),
        phase: index * 2
    });
}

worlds.forEach(createWorld);

// =====================================
// 9. CORAZÓN CENTRAL LUMINOSO
// =====================================

const heartGroup = new THREE.Group();

const heartShape = new THREE.Shape();

heartShape.moveTo(0, 0);

heartShape.bezierCurveTo(
    0, 1, -2, 2, -2, 0
);

heartShape.bezierCurveTo(
    -2, -2, 0, -3, 0, -4
);

heartShape.bezierCurveTo(
    0, -3, 2, -2, 2, 0
);

heartShape.bezierCurveTo(
    2, 2, 0, 1, 0, 0
);

const heartGeometry = new THREE.ExtrudeGeometry(
    heartShape,
    {
        depth: .5,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 2,
        bevelSize: .2,
        bevelThickness: .2
    }
);

const heart = new THREE.Mesh(
    heartGeometry,
    new THREE.MeshStandardMaterial({
        color: 0xff279c,
        emissive: 0xff006e,
        emissiveIntensity: 1.5,
        metalness: .3,
        roughness: .3
    })
);

heart.position.set(0, -3, 0);
heart.scale.set(.9, .9, .9);

heartGroup.add(heart);
scene.add(heartGroup);

// =====================================
// 10. ESTRELLAS FUGACES
// =====================================

const shootingStars = [];

function createShootingStar() {

    const material = new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 1
    });

    const geometry = new THREE.BufferGeometry();

    const start = new THREE.Vector3(
        (Math.random() - .5) * 120,
        30 + Math.random() * 40,
        (Math.random() - .5) * 100
    );

    const end = start.clone().add(
        new THREE.Vector3(-12, -12, -8)
    );

    geometry.setFromPoints([start, end]);

    const line = new THREE.Line(geometry, material);

    scene.add(line);

    shootingStars.push({
        mesh: line,
        life: 0
    });
}

// =====================================
// 11. SELECCIONAR Y VIAJAR
// =====================================

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let destination = null;
let targetPoint = null;
let moving = false;
let selected = null;
let showPanelAfterTravel = false;

const travelText = document.getElementById('travel');

function travelTo(mesh) {

    if(moving) return;

    selected = mesh;
    moving = true;
    showPanelAfterTravel = true;

    const group = mesh.userData.group;
    const info = mesh.userData.info;

    const worldPosition = new THREE.Vector3();

    group.getWorldPosition(worldPosition);

    const direction = new THREE.Vector3()
        .subVectors(camera.position, worldPosition)
        .normalize();

    destination = worldPosition.clone().add(
        direction.multiplyScalar(info.size * 3.5 + 1)
    );

    targetPoint = worldPosition.clone();

    controls.enabled = false;

    travelText.style.opacity = 1;

    setTimeout(() => {
        travelText.style.opacity = 0;
    }, 1100);
}

function showWorld(info) {

    document.getElementById('subtitle').textContent =
        info.subtitle;

    document.getElementById('planetTitle').textContent =
        info.name;

    document.getElementById('planetMessage').textContent =
        info.message;

    document.getElementById('planetPhoto').src =
        info.photo;

    document.getElementById('panel').style.display = 'block';
}

renderer.domElement.addEventListener('click', event => {

    if(moving || document.getElementById('panel').style.display === 'block') {
        return;
    }

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const hits = raycaster.intersectObjects(
        planets.map(p => p.mesh)
    );

    if(hits.length > 0) {
        travelTo(hits[0].object);
    }
});

// =====================================
// 12. VOLVER AL UNIVERSO
// =====================================

function goHome() {

    document.getElementById('panel').style.display = 'none';

    destination = new THREE.Vector3(0, 17, 58);
    targetPoint = new THREE.Vector3(0, 0, 0);

    selected = null;
    moving = true;
    showPanelAfterTravel = false;

    controls.enabled = false;
}

document.getElementById('close').onclick = goHome;
document.getElementById('returnButton').onclick = goHome;
document.getElementById('homeButton').onclick = goHome;

// =====================================
// 13. MÚSICA
// =====================================

const music = document.getElementById('music');
const musicButton = document.getElementById('musicButton');

let musicPlaying = false;

music.volume = .35;

musicButton.addEventListener('click', async () => {

    if(!musicPlaying) {

        try {
            await music.play();
            musicPlaying = true;
            musicButton.textContent = '♫ Música ON';
        } catch(error) {
            alert('No se pudo cargar la música. Revisa audio/musica.mp3');
        }

    } else {

        music.pause();
        musicPlaying = false;
        musicButton.textContent = '♫ Música';
    }
});

// =====================================
// 14. ANIMACIÓN GENERAL
// =====================================

const clock = new THREE.Clock();

let meteorTimer = 0;

function animate() {

    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    // Galaxia
    stars.rotation.y += .00012;
    nebula.rotation.y += .0008;

    // Corazón
    heart.rotation.y += .008;

    const pulse = 1 + Math.sin(time * 2.5) * .08;

    heart.scale.set(
        .9 * pulse,
        .9 * pulse,
        .9 * pulse
    );

    // Planetas
    planets.forEach((p, i) => {

        p.mesh.rotation.y += .003 + i * .0004;

        if(selected !== p.mesh) {

            p.group.position.y =
                p.original.y +
                Math.sin(time * .5 + p.phase) * .35;
        }
    });

    // Meteoritos periódicos
    meteorTimer += clock.getDelta();

    if(meteorTimer > 2.5) {
        createShootingStar();
        meteorTimer = 0;
    }

    shootingStars.forEach((s, i) => {

        s.life += .025;

        s.mesh.material.opacity =
            Math.max(0, 1 - s.life);

        if(s.life >= 1) {
            scene.remove(s.mesh);
            s.mesh.geometry.dispose();
            s.mesh.material.dispose();
            shootingStars.splice(i, 1);
        }
    });

    // Viaje cinematográfico
    if(moving && destination && targetPoint) {

        camera.position.lerp(destination, .025);
        controls.target.lerp(targetPoint, .025);

        if(camera.position.distanceTo(destination) < .12 &&
           controls.target.distanceTo(targetPoint) < .12) {

            camera.position.copy(destination);
            controls.target.copy(targetPoint);

            moving = false;
            controls.enabled = true;

            if(showPanelAfterTravel && selected) {
                showWorld(selected.userData.info);
            }
        }
    }

    controls.update();
    renderer.render(scene, camera);
}

animate();

// =====================================
// 15. AJUSTE DE PANTALLA
// =====================================

window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );
});

</script>

</body>
</html>
